<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rip_Dead Account — Authentication</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(123, 63, 255, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(0, 220, 255, 0.12),
                    transparent 35%
                ),
                #04040a;

            color: #ffffff;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.025),
                    transparent 40%
                );

            pointer-events: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .void-enter {
            animation:
                voidEnter
                0.7s
                ease
                both;
        }

        .void-exit {
            animation:
                voidExit
                0.5s
                ease
                both;
        }

        @keyframes voidEnter {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes voidExit {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(35px);
            }
        }

        .navbar {
            position: fixed;
            top: 16px;
            left: 50%;

            transform: translateX(-50%);

            width: calc(100% - 32px);
            max-width: 1200px;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 16px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(10, 10, 20, 0.72);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 18px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.35);
        }

        .brand {
            font-weight: 800;
            letter-spacing: -0.03em;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;

            color:
                rgba(255,255,255,0.72);

            font-size: 14px;
        }

        .nav-links a {
            transition:
                color 0.2s ease,
                opacity 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .main {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                120px
                20px
                100px;
        }

        .card {
            width: 100%;
            max-width: 560px;

            padding: 42px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,20,32,0.82),
                    rgba(8,8,15,0.78)
                );

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.45);

            text-align: center;
        }

        .icon {
            width: 76px;
            height: 76px;

            margin:
                0
                auto
                22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(125,70,255,0.35),
                    rgba(0,210,255,0.20)
                );

            border:
                1px solid
                rgba(255,255,255,0.10);

            font-size: 34px;
        }

        h1 {
            margin:
                0
                0
                10px;

            font-size: 30px;
            letter-spacing: -0.04em;
        }

        .description {
            margin:
                0
                auto
                28px;

            max-width: 440px;

            color:
                rgba(255,255,255,0.62);

            line-height: 1.6;
        }

        .status {
            min-height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            color:
                rgba(255,255,255,0.78);

            line-height: 1.5;
        }

        .status.success {
            color: #8dffbe;
        }

        .status.error {
            color: #ff8d9b;
        }

        .spinner {
            width: 26px;
            height: 26px;

            margin-right: 12px;

            border:
                3px solid
                rgba(255,255,255,0.12);

            border-top-color:
                #ffffff;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 46px;

            padding:
                0
                20px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.06);

            color: #ffffff;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            background:
                rgba(255,255,255,0.10);
        }

        .button.hidden {
            display: none;
        }

        footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;

            text-align: center;

            color:
                rgba(255,255,255,0.35);

            font-size: 12px;

            pointer-events: none;
        }

        @media (max-width: 800px) {
            .nav-links {
                display: none;
            }

            .card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar void-enter">
        <a
            class="brand"
            href="https://ripdead.de5.net/"
        >
            Rip_Dead
        </a>

        <div class="nav-links">
            <a href="https://ripdead.de5.net/">
                Home
            </a>

            <a href="https://ripdead.de5.net/art/">
                Art
            </a>

            <a href="https://ripdead.de5.net/downloads/">
                Downloads
            </a>

            <a href="https://ripdead.de5.net/blogs/">
                Blogs
            </a>
        </div>
    </nav>

    <main class="main">

        <section class="card void-enter">

            <div class="icon">
                🔐
            </div>

            <h1>
                Rip_Dead Account
            </h1>

            <p
                class="description"
                id="description"
            >
                Connecting your Rip_Dead Account...
            </p>

            <div
                class="status"
                id="status"
            >
                <div class="spinner"></div>
                <span>
                    Authenticating...
                </span>
            </div>

            <button
                class="button hidden"
                id="returnButton"
                type="button"
            >
                Return to Rip_Dead Site
            </button>

        </section>

    </main>

    <footer>
        © Rip_Dead — All rights reserved.
    </footer>

    <script>
        const OAUTH_EXCHANGE_URL =
            "https://vcwfgyikbvfzgqiljmry.supabase.co/functions/v1/oauth-exchange";

        const SITE_SESSION_KEY =
            "ripdead_site_session";

        const SITE_SESSION_EXPIRES_KEY =
            "ripdead_site_session_expires";

        const statusElement =
            document.getElementById("status");

        const descriptionElement =
            document.getElementById("description");

        const returnButton =
            document.getElementById("returnButton");

        function showStatus(
            message,
            type = ""
        ) {
            statusElement.className =
                "status";

            if (type) {
                statusElement.classList.add(type);
            }

            statusElement.innerHTML = "";

            const text =
                document.createElement("span");

            text.textContent =
                message;

            statusElement.appendChild(text);
        }

        function showLoading(
            message
        ) {
            statusElement.className =
                "status";

            statusElement.innerHTML = `
                <div class="spinner"></div>
                <span></span>
            `;

            statusElement
                .querySelector("span")
                .textContent = message;
        }

        function showReturnButton() {
            returnButton.classList.remove(
                "hidden"
            );
        }

        function goHome() {
            document.body.classList.add(
                "void-exit"
            );

            setTimeout(() => {
                window.location.href =
                    "https://ripdead.de5.net/";
            }, 450);
        }

        returnButton.addEventListener(
            "click",
            goHome
        );

        async function handleCallback() {
            const params =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                params.get("code");

            const state =
                params.get("state");

            const error =
                params.get("error");

            const errorDescription =
                params.get(
                    "error_description"
                );

            /*
             * OAuth provider denied access.
             */
            if (error) {
                showStatus(
                    errorDescription ||
                    "Authorization was denied.",
                    "error"
                );

                descriptionElement.textContent =
                    "The Rip_Dead Account authorization was not completed.";

                showReturnButton();

                return;
            }

            /*
             * No authorization code.
             */
            if (!code) {
                showStatus(
                    "No authorization code was provided.",
                    "error"
                );

                descriptionElement.textContent =
                    "This authentication request is missing the required OAuth code.";

                showReturnButton();

                return;
            }

            showLoading(
                "Exchanging authorization code..."
            );

            try {
                const response =
                    await fetch(
                        OAUTH_EXCHANGE_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    code:
                                        code,

                                    client_id:
                                        "ripdead-site",

                                    redirect_uri:
                                        "https://ripdead.de5.net/auth/callback/",

                                    state:
                                        state
                                })
                        }
                    );

                let result;

                try {
                    result =
                        await response.json();
                } catch {
                    result = null;
                }

                if (
                    !response.ok ||
                    !result ||
                    !result.success
                ) {
                    throw new Error(
                        result?.error ||
                        "Authentication exchange failed."
                    );
                }

                /*
                 * The Edge Function gives us a random,
                 * site-specific session token.
                 *
                 * It is NOT a Supabase service key.
                 */
                if (
                    !result.session_token
                ) {
                    throw new Error(
                        "The authentication server did not return a session."
                    );
                }

                localStorage.setItem(
                    SITE_SESSION_KEY,
                    result.session_token
                );

                if (
                    result.expires_at
                ) {
                    localStorage.setItem(
                        SITE_SESSION_EXPIRES_KEY,
                        result.expires_at
                    );
                }

                /*
                 * Remove ?code=... from browser history.
                 */
                window.history.replaceState(
                    {},
                    document.title,
                    "/auth/callback/"
                );

                showStatus(
                    "Authentication successful!",
                    "success"
                );

                descriptionElement.textContent =
                    "You are now signed in with your Rip_Dead Account.";

                setTimeout(() => {
                    goHome();
                }, 900);

            } catch (error) {
                console.error(
                    "[OAuth Callback]",
                    error
                );

                localStorage.removeItem(
                    SITE_SESSION_KEY
                );

                localStorage.removeItem(
                    SITE_SESSION_EXPIRES_KEY
                );

                showStatus(
                    error.message ||
                    "Authentication failed.",
                    "error"
                );

                descriptionElement.textContent =
                    "We couldn't complete the Rip_Dead Account sign-in.";

                showReturnButton();
            }
        }

        handleCallback();
    </script>

</body>
</html>
