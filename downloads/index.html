<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connecting Account - Rip_Dead Site</title>
    <link rel="icon" href="/favicon.ico">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "Segoe UI", sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 50% 40%, rgba(150,0,255,.3),
                rgba(0,0,0,.9), #000);
        }

        .panel {
            width: min(460px, 100%);
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(168,85,247,.25);
            border-radius: 18px;
            background: rgba(20,20,20,.8);
            box-shadow: 0 0 35px rgba(168,85,247,.12);
        }

        h1 {
            font-size: 23px;
            color: #d8b4fe;
        }

        p {
            color: #b5b5c5;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .status { color: #67e8f9; }
        .error { color: #ff7070; }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            background: #a855f7;
            color: #000;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover { background: #c084fc; }
    </style>
</head>

<body>
    <main class="panel">
        <h1>Rip_Dead Account</h1>
        <p id="status" class="status">Connecting your account...</p>
        <p id="details"></p>
        <a id="return-link" href="https://ripdead.de5.net/Downloads/"
           hidden>Return to Downloads</a>
    </main>

    <script>
    (() => {
        "use strict";

        const SITE_ORIGIN = "https://ripdead.de5.net";
        const CALLBACK_URL = SITE_ORIGIN + "/auth/callback/";
        const DOWNLOADS_URL = SITE_ORIGIN + "/Downloads/";

        const CLIENT_ID = "ripdead-site";

        const OAUTH_EXCHANGE_URL =
            "https://vcwfgyikbvfzgqiljmry.supabase.co/functions/v1/oauth-exchange";

        const SITE_SESSION_URL =
            "https://vcwfgyikbvfzgqiljmry.supabase.co/functions/v1/site-session";

        const SESSION_KEY = "ripdead_site_session";
        const SESSION_EXPIRES_KEY = "ripdead_site_session_expires";
        const STATE_KEY = "ripdead_oauth_state";

        const statusElement = document.getElementById("status");
        const detailsElement = document.getElementById("details");
        const returnLink = document.getElementById("return-link");

        function showError(message) {
            statusElement.textContent = "Account connection failed.";
            statusElement.className = "error";
            detailsElement.textContent = message;
            returnLink.hidden = false;
        }

        async function connectAccount() {
            const params = new URLSearchParams(window.location.search);

            const code = params.get("code");
            const returnedState = params.get("state");
            const oauthError = params.get("error");
            const oauthErrorDescription = params.get("error_description");

            // Remove query parameters from the visible address bar.
            window.history.replaceState(
                {},
                document.title,
                CALLBACK_URL
            );

            if (oauthError) {
                sessionStorage.removeItem(STATE_KEY);

                showError(
                    oauthErrorDescription ||
                    oauthError ||
                    "Authorization was cancelled."
                );
                return;
            }

            if (!code || !returnedState) {
                showError("The authorization response is missing its code or state.");
                return;
            }

            const expectedState = sessionStorage.getItem(STATE_KEY);
            sessionStorage.removeItem(STATE_KEY);

            if (!expectedState || returnedState !== expectedState) {
                showError(
                    "The OAuth state could not be verified. Please start again from Downloads."
                );
                return;
            }

            try {
                statusElement.textContent = "Exchanging authorization code...";

                const exchangeResponse = await fetch(OAUTH_EXCHANGE_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        code: code,
                        client_id: CLIENT_ID,
                        redirect_uri: CALLBACK_URL,
                        state: returnedState
                    }),
                    cache: "no-store"
                });

                const exchangeResult = await exchangeResponse.json();

                if (
                    !exchangeResponse.ok ||
                    exchangeResult.success !== true ||
                    typeof exchangeResult.session_token !== "string" ||
                    exchangeResult.session_token.length < 32
                ) {
                    throw new Error(
                        exchangeResult.error ||
                        "The account server did not return a valid site session."
                    );
                }

                const token = exchangeResult.session_token;

                statusElement.textContent = "Verifying your account session...";

                const verifyResponse = await fetch(SITE_SESSION_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token }),
                    cache: "no-store"
                });

                const verifyResult = await verifyResponse.json();

                if (
                    !verifyResponse.ok ||
                    verifyResult.success !== true ||
                    verifyResult.client_id !== CLIENT_ID
                ) {
                    throw new Error(
                        verifyResult.error ||
                        "The returned session could not be verified for Rip_Dead Site."
                    );
                }

                // Only save the token after the server confirms it is valid.
                localStorage.setItem(SESSION_KEY, token);

                const expiresAt =
                    verifyResult.expires_at ||
                    exchangeResult.expires_at;

                if (expiresAt) {
                    localStorage.setItem(
                        SESSION_EXPIRES_KEY,
                        expiresAt
                    );
                } else {
                    localStorage.removeItem(SESSION_EXPIRES_KEY);
                }

                statusElement.textContent = "Account connected successfully!";
                statusElement.className = "status";
                detailsElement.textContent =
                    "Returning you to Downloads...";

                window.setTimeout(() => {
                    window.location.replace(DOWNLOADS_URL);
                }, 900);

            } catch (error) {
                console.error("[RDA OAuth Callback]", error);

                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem(SESSION_EXPIRES_KEY);

                showError(
                    error instanceof Error
                        ? error.message
                        : "An unexpected error occurred."
                );
            }
        }

        connectAccount();
    })();
    </script>
</body>
</html>
