<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:black;

    font-family:
    "MS Sans Serif",
    Tahoma,
    Arial;

    cursor:url("icons/cursors/arrow.cur"),default;
}


/* SCREEN */

#screen{

    width:1080px;
    height:569px;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    overflow:hidden;

    background:black;
}


/* BOOT */

#boot{

    position:absolute;

    width:100%;
    height:100%;

    background:black;
}


#boot video{

    width:100%;
    height:100%;

    object-fit:fill;
}


/* BLACK SCREEN */

#blackScreen{

    position:absolute;

    width:100%;
    height:100%;

    background:black;

    display:none;

    z-index:10;
}


/* DOS */

#dos{

    position:absolute;

    left:15px;
    top:15px;

    color:white;

    font-family:monospace;

    font-size:22px;

    display:none;

    z-index:20;
}


#dosCursor{

    display:inline-block;

    width:12px;
    height:20px;

    background:white;

    animation:blink 1s infinite;
}


@keyframes blink{

    50%{
        opacity:0;
    }

}


/* DESKTOP */

#desktop{

    position:absolute;

    width:100%;
    height:100%;

    background:#008080;

    display:none;
}


.desktopIcon{

    position:absolute;

    width:90px;

    text-align:center;

    color:white;

    font-size:13px;
}


.desktopIcon img{

    width:32px;
    height:32px;
}


.desktopIcon span{

    display:block;

    margin-top:4px;

    text-shadow:
    1px 1px black;
}


/* TASKBAR */

#taskbar{

    position:absolute;

    bottom:0;
    left:0;

    width:100%;

    height:30px;

    background:#c0c0c0;

    border-top:
    2px solid white;

    display:flex;

    align-items:center;

    padding:2px;
}


#startButton{

    height:25px;

    font-weight:bold;

    background:#c0c0c0;


    border-top:
    2px solid white;

    border-left:
    2px solid white;

    border-right:
    2px solid #808080;

    border-bottom:
    2px solid #808080;


    cursor:url("icons/cursors/hover-button.cur"),pointer;

}


#clock{

    margin-left:auto;

    padding:3px 8px;

    height:24px;

    font-size:12px;


    border:
    2px solid #808080;


    border-right-color:white;

    border-bottom-color:white;

}


/* WINDOWS */

.window{

    position:absolute;

    background:#c0c0c0;


    border:
    2px solid white;


    border-right-color:#808080;

    border-bottom-color:#808080;


    display:none;

}


.titlebar{

    height:22px;

    background:#000080;

    color:white;


    font-weight:bold;


    padding-left:5px;


    display:flex;

    align-items:center;

}


.close{

    margin-left:auto;

    margin-right:3px;


    width:18px;

    height:18px;


    background:#c0c0c0;

    color:black;

}


.windowContent{

    padding:10px;
}


textarea{

    width:100%;

    height:120px;

    resize:none;

    font-family:monospace;
}


</style>

<script>


const desktop =
document.getElementById("desktop");


const screen =
document.getElementById("screen");


const bootVideo =
document.getElementById("bootVideo");


const blackScreen =
document.getElementById("blackScreen");


const dos =
document.getElementById("dos");


const startupSound =
document.getElementById("startupSound");



let bootFinished=false;



/* BOOT SYSTEM */


window.addEventListener("load",()=>{

    bootVideo.play().catch(err=>{

        console.log(
        "Boot blocked:",
        err
        );

    });

});



function startWindows(){

    if(bootFinished)
        return;


    bootFinished=true;


    bootVideo.style.display="none";


    blackScreen.style.display="block";



    setTimeout(()=>{


        blackScreen.style.display="none";


        dos.style.display="block";



        setTimeout(()=>{


            dos.style.display="none";


            desktop.style.display="block";



            startupSound.play().catch(err=>{

                console.log(
                "Sound blocked:",
                err
                );

            });


        },3000);



    },500);


}



bootVideo.addEventListener("ended",()=>{

    startWindows();

});



/* BACKUP IF VIDEO END EVENT FAILS */


bootVideo.addEventListener("timeupdate",()=>{


    if(
    bootVideo.duration &&
    bootVideo.currentTime >= bootVideo.duration-0.1
    ){

        startWindows();

    }


});


/* ICON SYSTEM */


function createIcon(name,image,x,y,action){


    let icon=document.createElement("div");


    icon.className="desktopIcon";


    icon.style.left=x+"px";

    icon.style.top=y+"px";



    icon.innerHTML=`

    <img src="${image}">

    <span>${name}</span>

    `;



    icon.onclick=action;



    desktop.appendChild(icon);


}

);
